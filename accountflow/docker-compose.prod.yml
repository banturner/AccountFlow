# Production overlay for Hostinger KVM2 (2 vCPU, 7.8 GB RAM, no swap).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Applied on top of docker-compose.yml. Four things it changes:
#
# 1. Runs WITHOUT the dev bind mount. The base file has no `./:/app` mount;
#    docker-compose.override.yml adds one for development and is only
#    auto-loaded by a bare `docker compose up`. Naming the files explicitly
#    (as above) skips the override, so the built image — not the host tree
#    with .env in it — is what runs. (An earlier version tried `volumes: []`
#    here; Compose merges volume lists by target, so an empty list removes
#    nothing. CI checks the rendered prod config for a leaked mount.)
#
# 2. Caps memory on every service. KVM2 has NO SWAP and shares RAM with
#    Ollama, whose hermes3 model claims ~5 GB the moment it is invoked.
#    Uncapped, a leak here gets the kernel OOM-killer to pick a victim, and
#    it may well pick Postgres mid-write or one of the kitchen bots.
#    This mirrors the mem_limit discipline already used in /opt/bots.
#
# 3. Cuts concurrency. 2 vCPU cannot usefully run 2 uvicorn workers plus 2
#    Celery children plus Postgres plus Ollama inference. One of each is
#    ample for a pilot polling three mailboxes every 120 seconds.
#
# 4. Names containers, so `docker ps` on a shared box stays readable
#    alongside kitchen-bot-1 / kitchen-bot-2 / agent-api.

services:
  db:
    container_name: accountflow-db
    mem_limit: 512m
    # Defaults assume a dedicated server. Trimmed for a shared 2-core box.
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
      -c effective_cache_size=384MB

  redis:
    container_name: accountflow-redis
    mem_limit: 128m
    # Broker + result backend only; never let it grow without bound.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru

  api:
    container_name: accountflow-api
    mem_limit: 640m
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

  worker:
    container_name: accountflow-worker
    mem_limit: 768m
    # --max-tasks-per-child recycles workers so a slow leak in a long-running
    # Python process can never creep toward the memory cap.
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=info --concurrency=1 --max-tasks-per-child=200

  beat:
    container_name: accountflow-beat
    mem_limit: 256m
    command: celery -A app.worker.celery_app beat --loglevel=info

  nginx:
    container_name: accountflow-nginx
    mem_limit: 128m
