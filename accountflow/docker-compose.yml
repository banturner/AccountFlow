# Base stack. Safe to run as-is in production — there is deliberately NO
# source bind mount here. Development gets its live-reload mount from
# docker-compose.override.yml, which Compose loads automatically for a bare
# `docker compose up`; production names its files explicitly
# (`-f docker-compose.yml -f docker-compose.prod.yml`), which skips the override.
version: "3.9"

# Cap container logs. Log lines carry mailbox addresses and error bodies and
# would otherwise accumulate unbounded on a box shared with three other apps.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accountflow}
      POSTGRES_USER: ${POSTGRES_USER:-accountflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accountflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    logging: *default-logging
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bind to loopback only — external traffic must come through nginx
      # (rate limiting + TLS). "8000:8000" would expose the API directly.
      - "127.0.0.1:8000:8000"

  worker:
    build: .
    restart: always
    logging: *default-logging
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: always
    logging: *default-logging
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - worker

  nginx:
    image: nginx:alpine
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
